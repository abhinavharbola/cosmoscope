name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  smoke:
    uses: ./.github/workflows/smoke.yml
  deploy:
    needs: smoke
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      NASA_PROXY_URL: ${{ vars.NASA_PROXY_URL }}
      FETCH_TEXTURES: ${{ vars.FETCH_TEXTURES }}
      BAKE_MISSIONS: ${{ vars.BAKE_MISSIONS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        if: env.FETCH_TEXTURES == 'true' || env.BAKE_MISSIONS == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm install --no-save sharp@0.35.4
        if: env.FETCH_TEXTURES == 'true'
      - run: npm run textures:fetch -- --only Earth,Moon --require-sha
        if: env.FETCH_TEXTURES == 'true'
      - run: npm run textures:check -- Earth,Moon
        if: env.FETCH_TEXTURES == 'true'
      - run: npm run missions:fetch
        if: env.BAKE_MISSIONS == 'true'
      - run: npm test
        if: env.FETCH_TEXTURES == 'true' || env.BAKE_MISSIONS == 'true'
      - run: npx playwright install --with-deps chromium
        if: env.FETCH_TEXTURES == 'true' || env.BAKE_MISSIONS == 'true'
      - run: npm run test:browser
        if: env.FETCH_TEXTURES == 'true' || env.BAKE_MISSIONS == 'true'
        env:
          CI: "true"
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html src textures vendor data _site/
          if [ -n "$NASA_PROXY_URL" ]; then
            node tools/inject-proxy.mjs _site/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
