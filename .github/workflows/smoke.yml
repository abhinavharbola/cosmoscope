name: Browser smoke tests
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: test-results
          retention-days: 14
